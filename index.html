<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capstone8000 – Team Profiles &amp; Project Ideas</title>
<style>
  /* Themes: chosen with the picker in the header, remembered in this browser (data-skin on <html>) */
  :root, html[data-skin="paper"] { --bg:#fff; --surface:#fff; --ink:#000; --muted:#555; --rule:#000; --soft:#ddd;
    --accent:#000; --accent-fg:#fff; --accent-hover:#333; --hdr-bg:#000; --hdr-fg:#fff;
    --name:#1d4ed8; --title:#b45309; color-scheme:light; }
  html[data-skin="concrete"] { --bg:#d6d6d6; --surface:#eee; --ink:#151515; --muted:#4a4a4a; --rule:#151515; --soft:#bbb;
    --accent:#151515; --accent-fg:#eee; --accent-hover:#3a3a3a; --hdr-bg:#151515; --hdr-fg:#eee;
    --name:#1a47b8; --title:#9a4a06; color-scheme:light; }
  html[data-skin="graphite"] { --bg:#1c1c1e; --surface:#26262a; --ink:#ececec; --muted:#a3a3a8; --rule:#8a8a90; --soft:#3a3a3e;
    --accent:#ececec; --accent-fg:#1c1c1e; --accent-hover:#fff; --hdr-bg:#0e0e10; --hdr-fg:#ececec;
    --name:#8ab4ff; --title:#ffb454; color-scheme:dark; }
  html[data-skin="ink"] { --bg:#000; --surface:#0b0b0b; --ink:#fff; --muted:#9a9a9a; --rule:#bdbdbd; --soft:#262626;
    --accent:#fff; --accent-fg:#000; --accent-hover:#ddd; --hdr-bg:#000; --hdr-fg:#fff;
    --name:#7fb0ff; --title:#ffc062; color-scheme:dark; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; display:flex; flex-direction:column; }
  header { background:var(--hdr-bg); color:var(--hdr-fg); padding:2.5rem 1rem 1.5rem; text-align:center; border-bottom:2px solid var(--rule); }
  header h1 { margin:0 0 .4rem; font-size:2rem; }
  header p { margin:0; opacity:.9; }
  nav { margin-top:1rem; }
  nav a { color:var(--hdr-fg); text-decoration:none; margin:0 .75rem; font-weight:600; border-bottom:2px solid transparent; }
  nav a:hover { border-color:var(--hdr-fg); }
  main { flex:1; width:100%; max-width:1100px; margin:0 auto; padding:1.5rem 1rem 3rem; }
  h2.section { margin:2rem 0 1rem; font-size:1.4rem; }
  .grid { display:grid; gap:1rem; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); }
  .card { background:var(--surface); border-radius:0; border:2px solid var(--rule); overflow:hidden; display:flex; flex-direction:column; }
  .card-head { padding:1rem 1.25rem; border-bottom:1px solid var(--rule); }
  .card-head h3 { margin:0; font-size:1.15rem; }
  .pname { color:var(--name); }
  .idea .card-head h3 { color:var(--title); }
  .avatar { width:44px; height:44px; border-radius:50%; background:var(--accent); color:var(--accent-fg); display:inline-flex; align-items:center; justify-content:center; font-weight:700; margin-right:.75rem; vertical-align:middle; }
  .row { display:flex; gap:.75rem; padding:.65rem 1.25rem; border-bottom:1px solid var(--soft); font-size:.95rem; }
  .row:last-child { border-bottom:0; }
  .row .k { flex:0 0 105px; color:var(--muted); font-weight:600; }
  .row .v { flex:1; }
  .tag { display:inline-block; background:var(--surface); color:var(--ink); border:1px solid var(--rule); border-radius:999px; padding:.1rem .6rem; margin:.1rem .15rem .1rem 0; font-size:.85rem; }
  .idea .body { padding:1rem 1.25rem; flex:1; }
  .idea .by { color:var(--muted); font-size:.85rem; margin-top:.5rem; }
  .actions { padding:.6rem 1.25rem; border-top:1px solid var(--rule); display:flex; gap:.5rem; }
  .btn { display:inline-block; text-decoration:none; border-radius:0; padding:.5rem .9rem; font-weight:600; }
  button { font:inherit; cursor:pointer; border:0; border-radius:0; padding:.5rem .9rem; font-weight:600; }
  .primary { background:var(--accent); color:var(--accent-fg); } .primary:hover { background:var(--accent-hover); }
  .ghost { background:var(--surface); color:var(--ink); border:1px solid var(--rule); } .danger { background:var(--surface); color:var(--ink); border:1px solid var(--rule); text-decoration:underline; }
  form { background:var(--surface); border-radius:0; border:2px solid var(--rule); padding:1.25rem; display:grid; gap:.75rem; }
  label { font-weight:600; font-size:.9rem; display:grid; gap:.3rem; }
  input, textarea { font:inherit; padding:.6rem .7rem; border:1px solid var(--rule); border-radius:0; width:100%; background:var(--bg); color:var(--ink); }
  textarea { min-height:90px; resize:vertical; }
  .empty { color:var(--muted); }
  #ideas-grid { display:grid; grid-template-columns:1fr; gap:1rem; }
  .idea { flex-direction:row; align-items:stretch; }
  .idea .card-head { flex:0 0 28%; border-bottom:0; border-right:2px solid var(--rule); display:flex; align-items:center; }
  .idea .card-head h3 { font-size:1.2rem; overflow-wrap:anywhere; }
  .idea .body { padding:1.1rem 1.5rem; flex:1; line-height:1.55; overflow-wrap:anywhere; }
  .idea .by { margin-top:.75rem; font-weight:600; }
  .idea .actions { flex:0 0 auto; flex-direction:column; justify-content:center; border-top:0; border-left:2px solid var(--rule); padding:1rem 1.25rem; }
  @media (max-width:700px) {
    .idea { flex-direction:column; }
    .idea .card-head { flex:none; border-right:0; border-bottom:2px solid var(--rule); }
    .idea .actions { flex-direction:row; border-left:0; border-top:2px solid var(--rule); }
  }
  .skinbar { margin-top:1rem; display:flex; flex-wrap:wrap; gap:.4rem; justify-content:center; align-items:center; font-size:.8rem; }
  .skinbar > span { text-transform:uppercase; letter-spacing:.08em; opacity:.8; margin-right:.25rem; }
  .skin { display:inline-flex; align-items:center; gap:.4rem; background:transparent; color:var(--hdr-fg); border:1px solid var(--hdr-fg); padding:.3rem .65rem .3rem .45rem; font-size:.8rem; font-weight:500; }
  .skin i { width:14px; height:14px; border-radius:50%; border:1px solid #888; background:linear-gradient(135deg,var(--sw1) 50%,var(--sw2) 50%); }
  .skin[aria-pressed="true"] { box-shadow:inset 0 0 0 1px var(--hdr-fg); font-weight:700; }
  footer { background:var(--hdr-bg); color:var(--hdr-fg); border-top:2px solid var(--rule); text-align:center; padding:1.25rem 1rem; font-size:.9rem; }
  footer a { color:var(--hdr-fg); }
</style>
<script>
  // apply the remembered theme before the page paints
  try { var k = localStorage.getItem("capstone8000-skin"); document.documentElement.setAttribute("data-skin", /^(paper|concrete|graphite|ink)$/.test(k) ? k : "paper"); }
  catch (e) { document.documentElement.setAttribute("data-skin", "paper"); }
</script>
</head>
<body>
<header>
  <h1>Capstone8000</h1>
  <p>Meet the team and share your ideas for the project</p>
  <nav><a href="#team">Team</a><a href="#ideas">Project Ideas</a><a href="#add">Add an Idea</a></nav>
  <div class="skinbar" id="skinbar" role="group" aria-label="Theme">
    <span>Theme</span>
    <button class="skin" type="button" data-skin="paper" style="--sw1:#fff;--sw2:#111"><i></i>Paper</button>
    <button class="skin" type="button" data-skin="concrete" style="--sw1:#d6d6d6;--sw2:#151515"><i></i>Concrete</button>
    <button class="skin" type="button" data-skin="graphite" style="--sw1:#1c1c1e;--sw2:#ececec"><i></i>Graphite</button>
    <button class="skin" type="button" data-skin="ink" style="--sw1:#000;--sw2:#fff"><i></i>Ink</button>
  </div>
</header>

<main>
  <h2 class="section" id="team">Team Profiles</h2>
  <div class="grid" id="profiles"></div>

  <h2 class="section" id="ideas">Project Ideas</h2>
  <div class="grid" id="ideas-grid"></div>

  <h2 class="section" id="add">Add an Idea</h2>
  <form id="idea-form">
    <input type="hidden" id="idea-id">
    <label>Your name <input id="idea-author" required maxlength="60"></label>
    <label>Idea title <input id="idea-title" required maxlength="100"></label>
    <label>Description <textarea id="idea-desc" required maxlength="1000"></textarea></label>
    <div><button class="primary" type="submit" id="idea-submit">Add idea</button>
         <button class="ghost" type="button" id="idea-cancel" hidden>Cancel edit</button></div>
    <p class="empty" id="idea-status" role="status"></p>
  </form>
</main>

<footer>
  &copy; <span id="year"></span> Capstone8000 &middot;
  <a href="https://github.com/kisshan2202/capstone8000">View on GitHub</a>
</footer>

<script>
  (function () {
    var bar = document.getElementById("skinbar");
    function mark() { var c = document.documentElement.getAttribute("data-skin");
      bar.querySelectorAll(".skin").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.skin === c); }); }
    bar.addEventListener("click", function (e) {
      var b = e.target.closest(".skin"); if (!b) return;
      document.documentElement.setAttribute("data-skin", b.dataset.skin);
      try { localStorage.setItem("capstone8000-skin", b.dataset.skin); } catch (err) {}
      mark();
    });
    mark();
  })();
</script>
<script type="module">

// ---- Team profiles: loaded from the "details" file in this repo ----
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const tags = a => a.map(x => `<span class="tag">${esc(x)}</span>`).join("");
const row = (k, v) => `<div class="row"><div class="k">${k}</div><div class="v">${v}</div></div>`;

const KEYS = { "name":"name", "from":"from", "it skills":"skills", "skills":"skills",
  "work experience":"experience", "experience":"experience", "hobbies":"hobbies",
  "future work":"future" };

function parseDetails(text) {
  const people = []; let cur = null, field = null;
  for (const raw of text.replace(/\r/g, "").split("\n")) {
    if (!raw.trim() || raw.trim().startsWith("#")) continue;
    const m = /^(\S[^:]*?)\s*:\s*(.*)$/.exec(raw);
    const key = m && KEYS[m[1].trim().toLowerCase()];
    if (key) {
      if (key === "name") { cur = { name:"", from:"", skills:"", experience:"", hobbies:"", future:"" }; people.push(cur); }
      if (!cur) continue;
      field = key; cur[key] = m[2].trim();
    } else if (cur && field) {           // continuation line of the previous field
      cur[field] += "\n" + raw.trim();
    }
  }
  const list = (v, sep) => v.split(sep).map(x => x.trim()).filter(Boolean);
  return people.filter(p => p.name).map(p => ({
    name:p.name, from:p.from,
    skills:list(p.skills, /[,\n]/), hobbies:list(p.hobbies, /[,\n]/),
    experience:list(p.experience, /[+\n]/), future:p.future.replace(/\n/g, " ")
  }));
}

function renderProfiles(people) {
  $("profiles").innerHTML = people.length ? people.map(p => `
    <article class="card">
      <div class="card-head"><span class="avatar">${esc(p.name.split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase())}</span><h3 class="pname" style="display:inline">${esc(p.name)}</h3></div>
      ${row("From", esc(p.from))}
      ${row("IT skills", tags(p.skills))}
      ${row("Experience", p.experience.map(esc).join("<br>"))}
      ${row("Hobbies", tags(p.hobbies))}
      ${row("Future work", esc(p.future))}
    </article>`).join("") : '<p class="empty">No profiles found in the details file.</p>';
}

fetch("details", { cache:"no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(t => renderProfiles(parseDetails(t)))
  .catch(() => { $("profiles").innerHTML = '<p class="empty">Could not load the details file.</p>'; });

// ---- Ideas: shared live via Firebase Realtime Database (profiles above work even if this fails) ----
let fb = null;
try {
  const [a, d] = await Promise.all([
    import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
  ]);
  fb = { ...a, ...d };
} catch {}
if (!fb) {
  $("ideas-grid").innerHTML = '<p class="empty">Could not load the ideas service.</p>';
} else {
  const { initializeApp, getDatabase, ref, onValue, push, set, update, remove } = fb;
  const app = initializeApp({
    apiKey: "AIzaSyAJSUcbcb0g55rzYdgClliC1lPBpIkRdvc",
    authDomain: "ironpeak-crm-1860093.firebaseapp.com",
    databaseURL: "https://ironpeak-crm-1860093-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "ironpeak-crm-1860093",
    appId: "1:336525024774:web:e6193da47404d8bf672d87"
  });
  const db = getDatabase(app);
  const ideasRef = ref(db, "capstone8000_ideas");   // only this path is used by this site
  let ideas = [];

  function renderIdeas() {
    $("ideas-grid").innerHTML = ideas.length ? ideas.map(i => `
      <article class="card idea">
        <div class="card-head"><h3>${esc(i.title)}</h3></div>
        <div class="body">${esc(i.desc).replace(/\n/g,"<br>")}<div class="by">Idea by ${esc(i.author || "Anonymous")}</div></div>
        <div class="actions">
          <button class="ghost" data-edit="${esc(i.id)}">Edit</button>
          <button class="danger" data-del="${esc(i.id)}">Delete</button>
        </div>
      </article>`).join("") : '<p class="empty">No ideas yet. Be the first to add one below!</p>';
  }

  onValue(ideasRef, snap => {
    const v = snap.val() || {};
    ideas = Object.entries(v).map(([id, d]) => ({ id, ...d })).sort((a, b) => (b.ts || 0) - (a.ts || 0));
    renderIdeas();
  }, () => { $("ideas-grid").innerHTML = '<p class="empty">Could not load ideas. Check the database rules.</p>'; });

  const status = msg => { $("idea-status").textContent = msg; };
  function resetForm() {
    $("idea-form").reset(); $("idea-id").value = "";
    $("idea-submit").textContent = "Add idea"; $("idea-cancel").hidden = true;
  }

  $("idea-form").addEventListener("submit", async e => {
    e.preventDefault();
    const id = $("idea-id").value;
    const data = { author:$("idea-author").value.trim(), title:$("idea-title").value.trim(), desc:$("idea-desc").value.trim() };
    $("idea-submit").disabled = true; status("Saving...");
    try {
      if (id) await update(ref(db, "capstone8000_ideas/" + id), data);
      else await set(push(ideasRef), { ...data, ts: Date.now() });
      resetForm(); status("Saved!");
      $("ideas").scrollIntoView({ behavior:"smooth" });
    } catch { status("Could not save. The database rules may not allow writing yet."); }
    $("idea-submit").disabled = false;
  });

  $("ideas-grid").addEventListener("click", async e => {
    const edit = e.target.dataset.edit, del = e.target.dataset.del;
    if (edit) {
      const i = ideas.find(x => x.id === edit); if (!i) return;
      $("idea-id").value = i.id; $("idea-author").value = i.author; $("idea-title").value = i.title; $("idea-desc").value = i.desc;
      $("idea-submit").textContent = "Save changes"; $("idea-cancel").hidden = false;
      $("add").scrollIntoView({ behavior:"smooth" });
    } else if (del && confirm("Delete this idea?")) {
      try { await remove(ref(db, "capstone8000_ideas/" + del)); } catch { alert("Could not delete. Check the database rules."); }
    }
  });
  $("idea-cancel").addEventListener("click", resetForm);

}

$("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
